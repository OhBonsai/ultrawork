name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux
          - windows
          - macos-intel
          - macos-arm64

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: macos-intel
            host: macos-latest
            target: x86_64-apple-darwin

          - platform: macos-arm64
            host: macos-latest
            target: aarch64-apple-darwin

          - platform: windows
            host: windows-latest
            target: x86_64-pc-windows-msvc

          - platform: linux
            host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.settings.host }}

    steps:
      - name: Check platform filter
        id: check
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.platform }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$INPUT" != "all" && "$INPUT" != "${{ matrix.settings.platform }}" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: steps.check.outputs.skip != 'true' && matrix.settings.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        if: steps.check.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Rust
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Rust cache
        if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.settings.target }}

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: bun install

      - name: Download opencode sidecar
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/desktop
        shell: bash
        run: bun ./scripts/predev.ts
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.settings.target }}

      - name: Build and upload artifacts
        if: steps.check.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@390cbe447412ced1303d35abe75287949e43437a
        timeout-minutes: 60
        with:
          projectPath: packages/desktop
          uploadWorkflowArtifacts: true
          args: >-
            --target ${{ matrix.settings.target }}
            --config ./src-tauri/tauri.prod.conf.json
            ${{ matrix.settings.platform == 'linux' && '--bundles deb' || '' }}
            ${{ matrix.settings.platform == 'windows' && '--bundles msi' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: v${{ steps.version.outputs.version }}
          name: ultrawork v${{ steps.version.outputs.version }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
