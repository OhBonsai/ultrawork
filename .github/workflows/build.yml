name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux
          - windows
          - macos-intel
          - macos-arm64
      release:
        description: "Create a release after build"
        required: false
        default: false
        type: boolean

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_target: x86_64-unknown-linux-gnu
            name: linux-x86_64

          - platform: windows
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_target: x86_64-pc-windows-msvc
            name: windows-x86_64

          - platform: macos-intel
            os: macos-13
            rust_target: x86_64-apple-darwin
            tauri_target: x86_64-apple-darwin
            name: macos-intel

          - platform: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_target: aarch64-apple-darwin
            name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check platform filter
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.platform }}" != "all" && "${{ github.event.inputs.platform }}" != "${{ matrix.platform }}" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: steps.check.outputs.skip != 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file

      - name: Setup Bun
        if: steps.check.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup Rust
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Rust cache
        if: steps.check.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "packages/desktop/src-tauri -> target"
          shared-key: ${{ matrix.name }}

      - name: Install frontend dependencies
        if: steps.check.outputs.skip != 'true'
        run: bun install

      - name: Build Tauri app (Linux)
        if: steps.check.outputs.skip != 'true' && matrix.platform == 'linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          args: --target ${{ matrix.tauri_target }} --bundles deb

      - name: Build Tauri app (Windows)
        if: steps.check.outputs.skip != 'true' && matrix.platform == 'windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          args: --target ${{ matrix.tauri_target }} --bundles msi

      - name: Build Tauri app (macOS)
        if: steps.check.outputs.skip != 'true' && startsWith(matrix.platform, 'macos')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/desktop
          args: --target ${{ matrix.tauri_target }} --bundles dmg

      - name: Upload artifacts (Linux)
        if: steps.check.outputs.skip != 'true' && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ultrawork-${{ matrix.name }}
          path: packages/desktop/src-tauri/target/${{ matrix.tauri_target }}/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: steps.check.outputs.skip != 'true' && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ultrawork-${{ matrix.name }}
          path: packages/desktop/src-tauri/target/${{ matrix.tauri_target }}/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: steps.check.outputs.skip != 'true' && startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ultrawork-${{ matrix.name }}
          path: packages/desktop/src-tauri/target/${{ matrix.tauri_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout for version
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: v${{ steps.version.outputs.version }}
          name: ultrawork v${{ steps.version.outputs.version }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
